services:
  authentication-service:
    image: authentication-service:latest
    build:
     context: .
     dockerfile: services/AuthenticationService/Api/Dockerfile
    environment:
      - HmacSecret=${HMAC_SECRET}
      - Kestrel__Endpoints__Https__Certificate__Path=${CERTS_PATH}
      - Kestrel__Endpoints__Https__Certificate__Password=${CERTS_PASSWORD}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__Key=${JWT_KEY}
      - Jwt__AccessTokenExpirationMinutes=${ACCESS_TOKEN_LIFETIME}
      - Jwt__RefreshTokenExpirationDays=${REFRESH_TOKEN_LIFETIME}
      - ConnectionStrings__AuthDbConnection=Host=authentication-service-database;Port=5432;Database=auth_db;Username=developer;Password=${AUTH_DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_RUNNING_IN_CONTAINER=true
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - public
      - authentication-internal
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      authentication-service-database:
        condition: service_healthy
  
  authentication-service-database:
    image: postgres:latest
    container_name: authentication-database
    environment:
      POSTGRES_USER: developer
      POSTGRES_DB: auth_db
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    networks:
      - public
      - authentication-internal
    volumes:
      - auth-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
networks:
  public:
    internal: false
  internal:
    internal: true
  authentication-internal:
    driver: bridge
    internal: true

volumes:
  auth-db-volume: